services:
  - type: web
    name: web-to-app-api
    env: python
    buildCommand: "python -m pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: web-to-app-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.8

databases:
  - name: web-to-app-db
    plan: free
